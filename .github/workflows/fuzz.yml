# Coverage-guided fuzzing (libFuzzer via cargo-fuzz) of every parser that handles untrusted input.
# NOTE: not executed on GitHub yet (written 2026-11-17); the same targets were run locally for 40 s each.
name: Fuzz

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 0" # weekly

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [ipc_lines, event_template, vault_file, policy_json, crypto_inputs, auth_proof, nip46_uri, nip46_event]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup toolchain install nightly --profile minimal
      - run: cargo +nightly install cargo-fuzz --locked
      - run: cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=300 -rss_limit_mb=2048
      - name: Keep any crashing input
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/
