# NOTE: first executed on GitHub on 2026-11-17 (see docs/TESTING.md for what each job proved). The Windows
# job runs the named-pipe smoke test (apps/embrd/tests/windows_smoke.rs); the full e2e suites are Unix-only. Before the first
# release: pin every `uses:` to a full commit SHA (see docs/RELEASE.md).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup show
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # A hung test must fail the job with a readable log, not sit for the 6 h default (a macOS job did).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - name: Run tests
        if: runner.os != 'macOS'
        timeout-minutes: 20
        run: cargo test --workspace --locked --no-fail-fast
      - name: Run tests (macOS - sequential and unbuffered so that a hang names its test)
        if: runner.os == 'macOS'
        timeout-minutes: 15
        run: cargo test --workspace --locked --no-fail-fast -- --test-threads=1 --nocapture

  arch-package:
    # Builds the Arch package exactly as `makepkg` would for a user (clean container, no network
    # tricks): catches packaging-only failures such as the LTO/secp256k1 link error found locally.
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install build tools
        run: pacman -Syu --noconfirm --needed base-devel git rust sudo
      - name: Let the build user install the package's dependencies (makepkg -s)
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
      - uses: actions/checkout@v4
      - name: Build the package as an unprivileged user
        run: |
          cp -r "$GITHUB_WORKSPACE" /home/builder/src && chown -R builder /home/builder/src
          cd /home/builder/src/packaging/arch
          sed -i "s|source=(.*|source=(\"\$_pkgname::git+file:///home/builder/src\")|" PKGBUILD
          sudo -u builder git config --global --add safe.directory '*'
          sudo -u builder makepkg -sf --noconfirm
          pacman -Qlp *.pkg.tar.zst

  interop:
    # Two-way interoperability with an independent implementation (nostr-tools, pinned).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: tests/interop/run.sh

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --locked

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
