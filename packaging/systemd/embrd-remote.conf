# Drop-in that lets the sandboxed embrd user unit open network sockets, which NIP-46 remote signing needs.
# The shipped unit allows AF_UNIX only, so the daemon cannot reach any relay (by design) until you do this:
#
#   mkdir -p ~/.config/systemd/user/embrd.service.d
#   cp /usr/share/doc/embr/examples/embrd-remote.conf ~/.config/systemd/user/embrd.service.d/remote.conf
#   systemctl --user daemon-reload && systemctl --user restart embrd.service
#
# Only do this if you use `embrctl remote enable`. Local signing never needs it.
[Service]
RestrictAddressFamilies=
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
