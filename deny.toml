# cargo-deny configuration: licence policy, security advisories, banned/duplicate crates, sources.
# Run locally with `cargo deny check`; CI runs it on every push.

[graph]
all-features = true

[advisories]
# Vulnerabilities and unmaintained/unsound crates are errors. Add an `ignore` entry only with a
# written justification and an expiry date.
version = 2
yanked = "deny"
# Reviewed 2026-11-17; revisit by 2027-03-01 or when AccessKit moves to zbus >= 6, whichever is first.
ignore = [
    # `zvariant`, `zbus_names` and `zvariant_derive` are "merged into zbus 6", not vulnerable. They are
    # reached only through eframe -> AccessKit's AT-SPI backend (screen-reader support on Linux) and
    # only by the desktop app. `embrd`, `embrctl` and every library crate do not depend on them
    # (checked with `cargo tree -p embrd -i zvariant`). Dropping AccessKit would remove accessibility
    # from the GUI, which we judge worse than an unmaintained-but-unvulnerable D-Bus encoder.
    { id = "RUSTSEC-2026-0370", reason = "zvariant merged into zbus 6; GUI-only via AccessKit AT-SPI" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names merged into zbus 6; GUI-only via AccessKit AT-SPI" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive merged into zbus 6; GUI-only via AccessKit AT-SPI" },
]

[licenses]
version = 2
# Embr itself is MIT. Only permissive licences are accepted for dependencies; no (A)GPL/LGPL/MPL
# code may enter the signer's dependency tree without an explicit decision recorded here.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "CC0-1.0",
    "Zlib",
    # Mozilla's CA root list shipped as *data* by `webpki-roots` (TLS to wss:// relays). Permissive.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

# Per-crate exceptions, each for a permissive licence that we do not want to allow tree-wide.
exceptions = [
    # Fonts bundled into the GUI binary as *data* by egui (Ubuntu-Light, Hack, emoji fonts…).
    { name = "epaint_default_fonts", allow = ["OFL-1.1", "Ubuntu-font-1.0"] },
    # Boost Software License (MIT-like), Windows-only clipboard support in the GUI.
    { name = "clipboard-win", allow = ["BSL-1.0"] },
    { name = "error-code", allow = ["BSL-1.0"] },
    # Public-domain dedication (the StatusNotifierItem/tray implementation, Linux GUI only).
    { name = "ksni", allow = ["Unlicense"] },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
    # No C TLS stack or OpenSSL in the signer's trust base.
    { name = "openssl" },
    { name = "openssl-sys" },
    # Key material is handled by RustCrypto/libsecp256k1 only. `ring` is allowed *solely* as the TLS
    # provider of rustls (transport to wss:// relays, ADR-9): it never sees a key, and NIP-46 content
    # is NIP-44-encrypted end to end regardless of TLS.
    # The one other direct user is `rcgen`, which mints throw-away certificates for the TLS test relay
    # (`embr-nip46` feature `testing`). It is absent from the dependency tree of `embrd`, `embrctl` and
    # `embr-desktop`; CI checks that (job `supply-chain`).
    { name = "ring", wrappers = ["rustls", "rustls-webpki", "rcgen"] },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
