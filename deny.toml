# cargo-deny configuration: licence policy, security advisories, banned/duplicate crates, sources.
# Run locally with `cargo deny check`; CI runs it on every push.

[graph]
all-features = true

[advisories]
# Vulnerabilities and unmaintained/unsound crates are errors. Add an `ignore` entry only with a
# written justification and an expiry date.
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
# Embr itself is MIT. Only permissive licences are accepted for dependencies; no (A)GPL/LGPL/MPL
# code may enter the signer's dependency tree without an explicit decision recorded here.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "CC0-1.0",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
    # No C TLS stack or OpenSSL in the signer's trust base.
    { name = "openssl" },
    { name = "openssl-sys" },
    # We use RustCrypto/libsecp256k1 only; a second crypto stack is a review burden.
    { name = "ring" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
