[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.87"
license = "MIT"
authors = ["embr contributors"]
repository = "https://github.com/Lwb89dev/embr"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"
dbg_macro = "deny"
print_stdout = "warn"
print_stderr = "warn"
todo = "deny"
unimplemented = "deny"

# Internal crates
[workspace.dependencies]
embr-core = { path = "crates/embr-core", version = "0.0.1" }
embr-crypto = { path = "crates/embr-crypto", version = "0.0.1" }
embr-vault = { path = "crates/embr-vault", version = "0.0.1" }
embr-policy = { path = "crates/embr-policy", version = "0.0.1" }
embr-ipc = { path = "crates/embr-ipc", version = "0.0.1" }
embr-platform = { path = "crates/embr-platform", version = "0.0.1" }
embr-client = { path = "crates/embr-client", version = "0.0.1" }

# Third-party (versions resolved by `cargo add`, see Cargo.lock)
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = { version = "1", features = ["derive"] }
hex = "0.4"
getrandom = "0.3"

# Dev profile: crypto at -O2 so KDF-heavy tests do not take minutes in debug builds.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
opt-level = 3
