[package]
name = "embr-nip46"
description = "NIP-46 remote signing transport for Embr: URIs, encrypted JSON-RPC, a small relay client, signer service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[example]]
name = "test_relay"
required-features = ["testing"]

[features]
# An in-process Nostr relay used by tests and the interop harness. Never enabled in the daemon.
testing = []

[dependencies]
embr-core.workspace = true
embr-crypto.workspace = true
embr-policy.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
hex.workspace = true
zeroize.workspace = true
getrandom.workspace = true
url = "2"
tokio = { version = "1", default-features = false, features = ["rt", "net", "io-util", "sync", "time", "macros"] }
tokio-util = { version = "0.7", default-features = false }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"

[dev-dependencies]
embr-nip46 = { path = ".", features = ["testing"] }
nostr = { version = "0.45", default-features = false, features = ["std", "os-rng", "nip44"] }

[lints]
workspace = true
